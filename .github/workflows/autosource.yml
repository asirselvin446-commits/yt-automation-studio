name: Auto-Source Content Engine

# Generates + uploads original videos entirely in the cloud, so it works 24/7
# even when your laptop is off. Niche/voice/frequency come from the config the
# desktop app saves to Supabase.
on:
  # Daily schedule: tops up to your configured videos-per-day. GitHub often
  # delays/skips crons at the top of the hour, so we use an off-peak minute and
  # add catch-up times. The worker's per-day quota guard means these only
  # generate when today's quota isn't met yet — so they never over-post.
  schedule:
    - cron: "37 6 * * *"    # ~11:37 IST
    - cron: "37 10 * * *"   # catch-up if the morning run was skipped
    - cron: "37 15 * * *"   # final catch-up for the day
  # Fired by the app's "Generate one now" button.
  repository_dispatch:
    types: [autosource-now]
  # Manual "Run workflow" button.
  workflow_dispatch:
    inputs:
      oneshot:
        description: "Generate exactly one video now"
        required: false
        default: "true"

# Never run two generators at once.
concurrency:
  group: autosource
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Ensure ffmpeg is available
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Generate + upload
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          WORKER_SECRET_KEY: ${{ secrets.WORKER_SECRET_KEY }}
          GEMINI_MODEL: gemini-flash-latest
          UPLOAD_CATEGORY_ID: "22"
          # A dispatch or manual run makes exactly one video now; the daily cron
          # tops up to your per-day quota.
          AUTOSOURCE_ONESHOT: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: python autosource.py
