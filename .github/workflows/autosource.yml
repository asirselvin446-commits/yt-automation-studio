name: Auto-Source Content Engine

# Generates + uploads original videos entirely in the cloud, so it works 24/7
# even when your laptop is off. Niche/voice/frequency come from the config the
# desktop app saves to Supabase.
on:
  # Hourly check (off-peak minute to dodge GitHub's top-of-hour congestion).
  # The worker only generates once it's at/after the upload time you set in the
  # app AND today's per-day quota isn't met — so it posts around your chosen
  # time and never over-posts. Hourly checks also self-heal skipped runs.
  schedule:
    - cron: "37 * * * *"
  # Fired by the app's "Generate one now" button.
  repository_dispatch:
    types: [autosource-now]
  # Manual "Run workflow" button.
  workflow_dispatch:
    inputs:
      oneshot:
        description: "Generate exactly one video now"
        required: false
        default: "true"

# Never run two generators at once.
concurrency:
  group: autosource
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Ensure ffmpeg is available
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Generate + upload
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          WORKER_SECRET_KEY: ${{ secrets.WORKER_SECRET_KEY }}
          GEMINI_MODEL: gemini-flash-latest
          UPLOAD_CATEGORY_ID: "22"
          # A dispatch or manual run makes exactly one video now; the daily cron
          # tops up to your per-day quota.
          AUTOSOURCE_ONESHOT: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: python autosource.py
